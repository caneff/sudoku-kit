[project]
name = "sudoku-kit"
version = "0.2.0"
description = "CP-SAT helpers, the SudokuMaker link codec and a five-status uniqueness check"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lzstring>=1.0.4", "ortools>=9.15"]

[project.scripts]
solve-guide = "sudoku_kit.solve_guide:main"
solve-deductions = "sudoku_kit.deduction_lines:main"

[dependency-groups]
dev = ["pytest", "ruff", "shellcheck-py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
