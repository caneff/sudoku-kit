[project]
name = "sudoku-kit"
version = "0.1.0"
description = "CP-SAT helpers, the SudokuMaker link codec and a five-status uniqueness check"
readme = "README.md"
requires-python = ">=3.11"
# Floors are the versions the tests ran against; nothing older was tried.
dependencies = ["lzstring>=1.0.4", "ortools>=9.15"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
