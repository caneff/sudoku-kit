name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The floor pyproject.toml declares and the newest Python uv ships: the two
  # differ in ways the tests reach (a link handed to Path.is_file raises
  # before 3.14 and answers False from it).
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The print test needs Chromium. It is cached on the locked Playwright
      # version and downloaded only on a cache miss, never on every run.
      - name: Playwright version
        id: playwright
        run: |
          version=$(python3 -c "import tomllib;print(next(p['version'] for p in tomllib.load(open('uv.lock','rb'))['package'] if p['name']=='playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium (cache miss)
        if: steps.chromium.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Install Chromium's system libraries
        run: uv run playwright install-deps chromium

      - name: Gate (Python ${{ matrix.python }})
        run: uvx --from rust-just just check
